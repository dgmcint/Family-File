# Tests and builds Family Keeper on macOS, Windows and Linux.
# Pushing a tag like v0.1.0 also publishes a GitHub Release with the downloads attached.
name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev

      - run: cargo test

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: bash scripts/make-macos-app.sh --zip

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/family-keeper.exe -DestinationPath dist/Family-Keeper-Windows.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist
          tar -czf dist/Family-Keeper-Linux-x86_64.tar.gz -C target/release family-keeper

      - uses: actions/upload-artifact@v4
        with:
          name: family-keeper-${{ runner.os }}
          path: dist/Family-Keeper-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
